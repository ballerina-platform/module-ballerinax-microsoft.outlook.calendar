  /users/{user-id}/calendars/{calendar-id}/events/{event-id}/attachments/createUploadSession:
    description: Provides operations to call the createUploadSession method.
    post:
      tags:
      - users.calendar
      summary: Invoke action createUploadSession
      description: 'Create an upload session that allows an app to iteratively upload ranges of a file, so as to attach the
        file to the specified Outlook item. The item can be a message or event. Use this approach to attach a file if the
        file size is between 3 MB and 150 MB. To attach a file that''s smaller than 3 MB, do a POST operation on the attachments
        navigation property of the Outlook item; see how to do this for a message or for an event. As part of the response,
        this action returns an upload URL that you can use in subsequent sequential PUT queries. Request headers for each
