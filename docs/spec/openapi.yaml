  /me/calendar/calendarView/delta():
    description: Provides operations to call the delta method.
    get:
      tags:
      - me.calendar
      summary: Invoke function delta
      description: Get a set of event resources that have been added, deleted, or updated in a calendarView (a range of events
        defined by start and end dates) of the user's primary calendar. Typically, synchronizing events in a calendarView
        in a local store entails a round of multiple delta function calls. The initial call is a full synchronization, and
        every subsequent delta call in the same round gets the incremental changes (additions, deletions, or updates). This
        allows you to maintain and synchronize a local store of events in the specified calendarView, without having to fetch
        all the events of that calendar from the server every time.
      externalDocs:
        description: Find more info here
        url: https://learn.microsoft.com/graph/api/event-delta?view=graph-rest-1.0
      operationId: me.calendar.calendarView.delta
